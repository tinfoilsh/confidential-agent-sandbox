Host monitor
    HostName 10.254.0.1
    Port 22
    Include /run/workspace/monitor-bootstrap.conf
    IdentityFile /run/workspace/host_key
    IdentitiesOnly yes
    IdentityAgent none
    BatchMode yes
    UserKnownHostsFile /dev/null
    GlobalKnownHostsFile /dev/null
    StrictHostKeyChecking no
    UpdateHostKeys no
    CheckHostIP no
    PreferredAuthentications publickey
    ForwardAgent no
    ForwardX11 no
    PermitLocalCommand no
    ExitOnForwardFailure yes
    ConnectTimeout 10
    ServerAliveInterval 15
    ServerAliveCountMax 3
    RemoteForward 127.0.0.1:22 127.0.0.1:22
    RemoteForward 127.0.0.1:443 127.0.0.1:8443
