Host monitor
    Include /run/monitor/endpoint.conf
    User sandbox
    IdentityFile /run/workspace/host_key
    IdentitiesOnly yes
    IdentityAgent none
    BatchMode yes
    HostKeyAlias monitor
    UserKnownHostsFile /run/monitor/known_hosts
    GlobalKnownHostsFile /dev/null
    StrictHostKeyChecking yes
    ExitOnForwardFailure yes
    ConnectTimeout 10
    ServerAliveInterval 15
    ServerAliveCountMax 3
    RemoteForward 127.0.0.1:22 127.0.0.1:22
