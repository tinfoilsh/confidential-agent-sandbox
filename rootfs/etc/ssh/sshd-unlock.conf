# Before disk unlock, the measured owner can only send an unlock request.
Port 22
ListenAddress 127.0.0.1
HostKey /run/workspace/host_key
AuthorizedKeysFile /run/workspace/authorized_keys
AllowUsers sandbox
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM yes
DisableForwarding yes
PermitTTY no
PermitUserRC no
PermitUserEnvironment no
ForceCommand /usr/local/libexec/workspace-enroll --unlock
PidFile /run/workspace/sshd-unlock.pid
