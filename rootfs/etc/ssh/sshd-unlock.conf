# The measured owner installs Monitor credentials and unlocks the volume over SSH.
Port 22
ListenAddress 127.0.0.1
HostKey /run/workspace/host_key
AuthorizedKeysFile /run/workspace/authorized_keys
AllowUsers sandbox
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM yes
DisableForwarding yes
PermitTTY no
PermitUserRC no
PermitUserEnvironment no
PidFile /run/workspace/sshd-unlock.pid
