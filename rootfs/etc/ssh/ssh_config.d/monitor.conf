Host monitor
    # Forward the attested Monitor SSH endpoint to this port with sandbox ssh -R.
    HostName 127.0.0.1
    Port 12223
    User monitor
    IdentityFile /home/sandbox/.ssh/monitor_ed25519
    IdentitiesOnly yes
    IdentityAgent none
    HostKeyAlias monitor
    UserKnownHostsFile /home/sandbox/.ssh/monitor_known_hosts
    GlobalKnownHostsFile /dev/null
    StrictHostKeyChecking yes
