Host monitor
    HostName 10.254.0.1
    Port 22
    User monitor
    IdentityFile /run/monitor/identity
    IdentitiesOnly yes
    IdentityAgent none

Host monitor *.monitor
    HostKeyAlias monitor
    UserKnownHostsFile /run/monitor/known_hosts
    GlobalKnownHostsFile /dev/null
    StrictHostKeyChecking yes
    UpdateHostKeys no
