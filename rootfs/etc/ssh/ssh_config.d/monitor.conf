# Other bunkers dial this one by its identity name, so it publishes under the identity's key.
Host monitor-route
    Include /run/workspace/monitor-bootstrap.conf
    # Monitor reaches wildcard listeners as 127.0.0.2, which 127.0.0.1 listeners do not accept.
    RemoteForward 127.0.0.1:1080
    PermitRemoteOpen 127.0.0.2:*
    ExitOnForwardFailure yes
    ServerAliveInterval 15
    ServerAliveCountMax 3

Host monitor monitor-route
    HostName 10.254.0.1
    Port 22
    User monitor
    IdentityFile /run/monitor/identity
    IdentitiesOnly yes
    IdentityAgent none

Host monitor monitor-route *.monitor
    HostKeyAlias monitor
    UserKnownHostsFile /run/monitor/known_hosts
    GlobalKnownHostsFile /dev/null
    StrictHostKeyChecking yes
    UpdateHostKeys no
