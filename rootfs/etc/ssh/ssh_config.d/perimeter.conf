Host perimeter
    HostName 10.254.0.1
    Port 22
    User monitor
    IdentityFile /run/perimeter/identity
    IdentitiesOnly yes
    IdentityAgent none

Host perimeter *.perimeter
    HostKeyAlias perimeter
    UserKnownHostsFile /run/perimeter/known_hosts
    GlobalKnownHostsFile /dev/null
    StrictHostKeyChecking yes
    UpdateHostKeys no
