# An Ubuntu workspace with measured CVM-wide administrator access. Connect with
# `tinfoil sandbox ssh`, which tunnels over the shim's attested TLS.
cvm-version: 0.14.8
# cpus: 32
# memory: 524288
# gpus: 8
cpus: 4
memory: 8192

networks:
  dev:
    egress: open          # needed for apt and pip

volumes:
  - name: workspace
    # Persistent encrypted disk, opened by the volume key an enrollment spends.
    exec: true

containers:
  - name: "workspace"
    image: "ghcr.io/tinfoilsh/confidential-agent-sandbox@sha256:92622663616ec1beacbd738c837d89b7fba41aeb9c0bc8fd40bea1aebe78a1d5" # v0.1.6
    # runtime: nvidia
    # gpus: all
    restart: on-failure
    cvm_admin: true
    stop_signal: SIGRTMIN+3
    stop_timeout: 120
    networks: [dev]
    volumes: [workspace:/mnt/disk]

    # Every published port lands on the CVM's loopback and is reachable only
    # through the shim's CONNECT tunnel, which this config leaves unkeyed: what a
    # session binds on one of these answers to anyone who knows the domain. 22 is
    # sshd, which accepts publickey against the enrolled key and nothing else.
    # The rest are what dev servers, desktops and databases bind by default;
    # 8080 is taken by the enrollment API above.
    ports:
      - '22:22'
      - '3000:3000'
      - '3001:3001'
      - '4000:4000'
      - '5000:5000'
      - '5173:5173'
      - '8000:8000'
      - '8001:8001'
      - '8888:8888'
      - '9000:9000'
      - '9222:9222'
      - '3389:3389'
      - '5900:5900'
      - '3306:3306'
      - '5432:5432'
      - '6379:6379'

    env:
      # Per launch, from the unmeasured external config tinfoild writes.
      - DOMAIN
      # Measured: who may introduce this workspace's owner.
      - SANDBOX_PERMIT_ISSUER: https://orchestrator.tinfoil.sh
      # base64 SPKI DER of the public half of the orchestrator's permit key:
      #   openssl pkey -pubout -in permit.key.pem -outform DER | base64 -w0
      - SANDBOX_PERMIT_KEY: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEe7Dz4UoNi9fKoAq9DMgv+moqp+dyZyVSeRlAiVlFqZNAMLaamYJotUmKSR7OAT7AND1fC47oDfzOOX9nOs72ew==

    tmpfs:
      /run: "rw,nosuid,nodev,mode=755"

    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s

shim:
  # /enroll spends orchestrator's permit; /healthz publishes the nonce it must name.
  upstream-port: 8080
  authenticated: false
  paths:
    - /enroll
    - /healthz
