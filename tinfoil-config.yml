# An Ubuntu workspace with measured CVM-wide administrator access. Connect with
# native SSH through Perimeter after attested disk unlock.
# Requires a CVM release with 10.254.0.0/24 alias support and host capability 5.
cvm-version: 0.15.3-rc.1@sha256:ddd2e76a629df1bd4ec507441a387ac5db010ebc1bda3e372756e095df8692eb
# cpus: 32
# memory: 524288
# gpus: 8
cpus: 4
memory: 8192

networks:
  dev:
    # The host permits only the assigned Perimeter after measured boot.
    egress: open

attested-keys:
  - id: host-ssh
    key: ecdsa-p256
  # Owner sessions are Noise handshakes to this per-boot key.
  - id: owner-session
    key: x25519

volumes:
  - name: workspace
    size: 30GiB
    # Persistent encrypted disk, opened by the volume key sent over an owner session.
    exec: true
    # The pack is read-only, so a writable store is the volume layered over it.
    overlays:
      - model: nix
        source: nix/store
        target: store

models:
  - name: nix
    # The pack holds programs, not weights.
    exec: true
    repo: "nix/sandbox-toolchain@3ihjxavsi7h20k860bppgczg3ry09fwb"
    mwp: "07ef8039a204ef98bdae69c25fcc26ee100c967e573c0a0c653a1ea83cbc6399_93396746240_443d6531-7126-5e2d-99d6-4757224dca61"

containers:
  - name: "workspace"
    image: "ghcr.io/tinfoilsh/confidential-agent-sandbox@sha256:a37ad20683e56e9b46b16a03b32db5423154d783b4df660e2ec138986e2ab310" # rewritten at release
    # runtime: nvidia
    # gpus: all
    restart: on-failure
    cvm_admin: true
    attestation: true
    stop_signal: SIGRTMIN+3
    stop_timeout: 120
    networks: [dev]
    keys: [host-ssh, owner-session]
    models: [nix]
    persistent_volumes: [workspace:/mnt/disk, workspace:/nix]

    # Native SSH is also published through the Perimeter reverse connection.
    # sshd accepts only the measured owner public key.
    ports:
      - '22:22'

    env:
      # The dashboard supplies public owner and resource bindings.
      - SANDBOX_OWNER_PUBLIC_KEY: ""
      - SANDBOX_INSTANCE_ID: ""
      - NO_MONITOR: ""

    tmpfs:
      /run: "rw,nosuid,nodev,mode=755"

    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s

shim:
  # Owner access uses attested SSH through Perimeter, so no public CA is needed.
  tls-mode: self-signed
  upstream-port: 8080
  authenticated: false
  paths:
    - /healthz
    - /owner/ws
