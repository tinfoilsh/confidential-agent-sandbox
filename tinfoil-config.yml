shim-version: v0.3.18@sha256:7d9f98be78c91ede89f43c948a12d084fae34312effe9395ca7ed572991cb561
cvm-version: 0.7.5
cpus: 2
memory: 4096

containers:
  # Answers the router. Holds the sandbox key binding; has a network but
  # no workspace.
  - name: "mcp-server"
    image: "ghcr.io/tinfoilsh/confidential-agent-sandbox/mcp-server@sha256:0297223be4dee74ceed799d33afa3ac20b4f7253b1ed91335a1c87b4ea9bcb9c" # v0.0.1
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    memory: "512m"
    cpus: 0.5
    volumes:
      - "execsock:/run/execsock"

  # Runs the agent's commands. Holds the workspace; has no network, which
  # is what makes "the sandbox has no network access" true rather than a
  # promise made in a prompt.
  - name: "executor"
    image: "ghcr.io/tinfoilsh/confidential-agent-sandbox/executor@sha256:6d55c8f195013ec14b4cc3c0b640dda203489eddad4354bc3649b47d7e113adc" # v0.0.1
    user: "1000:1000"
    read_only: true
    tmpfs:
      # The workspace is RAM. It survives every turn and every
      # conversation this VM serves, and nothing beyond the VM.
      /workspace: "size=1g,mode=1777"
      /tmp: "size=512m,mode=1777"
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    memory: "3g"
    cpus: 1.5
    network_mode: "none"
    volumes:
      - "execsock:/run/execsock"

shim:
  listen-port: 443
  upstream-port: 8000
  paths:
    - /mcp
    - /health
