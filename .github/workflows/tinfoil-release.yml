# Tinfoil Containers release workflow (phase 1 — initiate a release).
#
# Trigger this workflow from a branch via "Run workflow" and provide the
# version. It creates the release tag and then dispatches phase 2 in
# `tinfoil-release-publish.yml` against the new tag to measure the config and
# publish the GitHub release. This repository ships no container: the sandbox
# runs inside the image named by `cvm-source`, so there is nothing to build.

name: Tinfoil Release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0)'
        required: true
        type: string

concurrency:
  group: tinfoil-container-release-${{ inputs.version }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # update-container-action pushes the release tag
      pull-requests: write  # required by update-container-action
      actions: write        # dispatch tinfoil-release-publish.yml on the new tag

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Check if version tag already exists
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Create the release tag
        uses: tinfoilsh/update-container-action@5e0a3789316941664cee055706799114e0180565 # v0.6.0
        with:
          version: ${{ inputs.version }}
          source-sha: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch the publish workflow on the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run tinfoil-release-publish.yml --ref "$VERSION"
